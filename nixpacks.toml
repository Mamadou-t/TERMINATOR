# Config Nixpacks pour la SPA React Router (Dokploy).
# Corrige 3 pieges par defaut de Nixpacks sur ce projet :
#  1) il installe sans les devDependencies (donc sans `vite`) -> on force --include=dev
#  2) `npm ci` sur un lockfile genere sur une autre plateforme (Windows) ne
#     resout pas toujours les binaires natifs optionnels de la plateforme de
#     build (ex: @rolldown/binding-linux-x64-gnu) -> bug npm connu
#     (github.com/npm/cli/issues/4828). `npm install` re-resout correctement.
#  3) l'app est en mode SPA (ssr:false) : pas de serveur genere, donc `npm start`
#     ne marche pas -> on sert le build statique (build/client) avec `serve`.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx serve -s build/client -l ${PORT:-3000}"
