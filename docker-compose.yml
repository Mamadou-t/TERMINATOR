services:
  db:
    image: postgres:16
    container_name: terminator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: terminator_db
      POSTGRES_USER: terminator_user
      POSTGRES_PASSWORD: terminator_pass
    ports:
      - "5432:5432"
    volumes:
      - terminator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminator_user -d terminator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  terminator_pgdata:
