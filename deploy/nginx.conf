# nginx : sert la SPA (React Router, mode SPA) et proxifie l'API Django.
# Meme origine pour le front et l'API => pas de CORS a gerer.

server {
    listen 80;
    server_name _;

    # Signatures / images en base64 dans les payloads : on autorise large.
    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers du build (hash) : cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API Django.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Django.
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statiques Django (admin/DRF) servis par WhiteNoise.
    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    # Routage cote client de la SPA : tout le reste retombe sur index.html.
    location / {
        try_files $uri /index.html;
    }
}
