# nginx : sert uniquement la SPA (React Router, mode SPA).
# Sur Dokploy, c'est Traefik qui gere le routage /api et le HTTPS ; nginx ne
# fait donc PAS de reverse-proxy ici (le front appelle l'API via VITE_API_BASE_URL).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers du build (avec hash) : cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routage cote client de la SPA : tout le reste retombe sur index.html.
    location / {
        try_files $uri /index.html;
    }
}
